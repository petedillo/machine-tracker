<!DOCTYPE html>
<html>
<head>
    <title>Machine Management System</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h1>Machine Management System</h1>
    
    <div class="version-selector">
        <label>Select Version:</label>
        <select id="versionSelect" onchange="loadVersion()">
        </select>
    </div>

    <div class="add-form">
        <h2>Add New Machine</h2>
        <form id="addMachineForm">
            <div>
                <label>Hostname:</label>
                <input type="text" id="hostname" required>
            </div>
            <div>
                <label>User:</label>
                <input type="text" id="user" required>
            </div>
            <div>
                <label>Device:</label>
                <input type="text" id="device" required>
            </div>
            <div>
                <label>OS:</label>
                <input type="text" id="os" required>
            </div>
            <div>
                <label>Role:</label>
                <input type="text" id="role" required>
            </div>
            <button type="submit">Add Machine</button>
        </form>
    </div>

    <div id="machinesList"></div>

    <script src="js/main.js"></script>
</body>
</html>
