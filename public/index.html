<!DOCTYPE html>
<html>
<head>
    <title>Machine Management System</title>
    <style>
        .machine-card {
            border: 1px solid #ccc;
            margin: 10px;
            padding: 15px;
            border-radius: 5px;
        }
        .version-selector {
            margin: 20px 0;
        }
        #machinesList {
            margin: 20px;
        }
        .add-form {
            margin: 20px;
            padding: 20px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <h1>Machine Management System</h1>
    
    <div class="version-selector">
        <label>Select Version:</label>
        <select id="versionSelect" onchange="loadVersion()">
        </select>
    </div>

    <div class="add-form">
        <h2>Add New Machine</h2>
        <form id="addMachineForm">
            <div>
                <label>Hostname:</label>
                <input type="text" id="hostname" required>
            </div>
            <div>
                <label>User:</label>
                <input type="text" id="user" required>
            </div>
            <div>
                <label>Device:</label>
                <input type="text" id="device" required>
            </div>
            <div>
                <label>OS:</label>
                <input type="text" id="os" required>
            </div>
            <div>
                <label>Role:</label>
                <input type="text" id="role" required>
            </div>
            <button type="submit">Add Machine</button>
        </form>
    </div>

    <div id="machinesList"></div>

    <script>
        // Load all versions
        async function loadVersions() {
            const response = await fetch('/versions');
            const versions = await response.json();
            const select = document.getElementById('versionSelect');
            select.innerHTML = versions.map(v => 
                `<option value="${v.version}">Version ${v.version} - ${new Date(v.timestamp).toLocaleString()}</option>`
            ).join('');
            loadVersion();
        }

        // Load specific version
        async function loadVersion() {
            const version = document.getElementById('versionSelect').value;
            const response = await fetch(`/machines/${version}`);
            const data = await response.json();
            displayMachines(data.machines);
        }

        // Display machines
        function displayMachines(machines) {
            const container = document.getElementById('machinesList');
            container.innerHTML = Object.entries(machines).map(([name, machine]) => `
                <div class="machine-card">
                    <h3>${name}</h3>
                    <p>Hostname: ${machine.hostname}</p>
                    <p>User: ${machine.user}</p>
                    <p>Device: ${machine.device}</p>
                    <p>OS: ${machine.os}</p>
                    <p>Role: ${machine.role}</p>
                    <h4>Services:</h4>
                    <pre>${JSON.stringify(machine.services, null, 2)}</pre>
                    <h4>Network:</h4>
                    <pre>${JSON.stringify(machine.network, null, 2)}</pre>
                    <button onclick="editMachine('${name}')">Edit</button>
                </div>
            `).join('');
        }

        // Add new machine
        document.getElementById('addMachineForm').onsubmit = async (e) => {
            e.preventDefault();
            const machine = {
                hostname: document.getElementById('hostname').value,
                user: document.getElementById('user').value,
                device: document.getElementById('device').value,
                os: document.getElementById('os').value,
                role: document.getElementById('role').value,
                services: {},
                network: {
                    accessible_by: [],
                    can_ssh_into: [],
                    registry_accessible: false
                }
            };

            await fetch('/machines', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(machine)
            });

            loadVersions();
            e.target.reset();
        };

        // Initial load
        loadVersions();
    </script>
</body>
</html>
